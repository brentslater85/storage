services:
  storage:
    build: .
    image: storage-service:local
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/storage
    mem_limit: 1g
    memswap_limit: 1g
    # The application may only write to a 200MB scratch area; file content lives in MongoDB.
    read_only: true
    tmpfs:
      - /tmp:size=200m
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
