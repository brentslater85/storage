spring:
  application:
    name: storage-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Spring's multipart support buffers uploads to disk; we stream the raw request body instead.
      enabled: false
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/storage}

management:
  endpoints:
    web:
      exposure:
        include: health
